# Production configuration for the existing ruoyi-admin application.
# Copy as config/fire-relay-local.properties beside the deployed application.
# Keep the existing production certificate and key paired with the Kylin relay.
# Do not overwrite the development computer's existing local configuration.
fire.relay.enabled=true
fire.relay.bind-address=127.0.0.1
fire.relay.port=22000
fire.relay.node-id=site-01
fire.relay.allowed-source-cidrs=10.5.89.0/24,10.5.90.0/24
fire.relay.key-store=./config/fire-relay-private/receiver.p12
fire.relay.key-store-password-file=./config/fire-relay-private/keystore-password.secret
fire.relay.secret-file=./config/fire-relay-private/relay.secret

# Camera bindings retain the real device address. Only the server SDK uses the tunnel.
fire.video.dahua.tunnels.shanpan.device-host=10.5.90.150
fire.video.dahua.tunnels.shanpan.device-port=37777
fire.video.dahua.tunnels.shanpan.local-port=33777
