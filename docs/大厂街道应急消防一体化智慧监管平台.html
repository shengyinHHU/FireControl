<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大厂街道应急消防一体化智慧监管平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --font-scale: 1.2;
      --bg: #010610;
      --panel-bg: rgba(4, 18, 42, 0.72);
      --border: #0a6eb8;
      --border-glow: #00c8ff;
      --text: #e8f4ff;
      --text-dim: #7eb8d8;
      --accent: #00a0e9;
      --accent2: #00d4ff;
      --warn: #f5c842;
      --success: #3dd68c;
      --danger: #ff6b6b;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.6; filter: blur(0); }
      50% { opacity: 1; filter: blur(1px); }
    }
    @keyframes scan-move {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }
    @keyframes border-flow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 200%; }
    }
    @keyframes float-up {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes radar-sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes glitch {
      0%, 90%, 100% { opacity: 1; transform: translate(0); }
      92% { opacity: 0.8; transform: translate(-2px, 1px); }
      94% { opacity: 0.9; transform: translate(2px, -1px); }
      96% { opacity: 0.7; transform: translate(-1px, 2px); }
    }
    @keyframes fade-slide-in {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes title-glow {
      0%, 100% { text-shadow: 0 0 20px rgba(0,212,255,0.5), 0 0 40px rgba(0,160,233,0.3); }
      50% { text-shadow: 0 0 30px rgba(0,212,255,0.9), 0 0 60px rgba(0,160,233,0.5), 0 0 80px rgba(0,100,200,0.3); }
    }
    @keyframes deco-expand {
      0%, 100% { width: 60px; opacity: 0.6; }
      50% { width: 90px; opacity: 1; }
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      background:
        linear-gradient(rgba(0, 180, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 180, 255, 0.03) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 0%, rgba(0, 120, 200, 0.2) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(0, 60, 180, 0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 10% 60%, rgba(0, 100, 200, 0.08) 0%, transparent 40%),
        var(--bg);
      background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
    }

    /* ===== Header ===== */
    .header {
      height: 78px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
      background: linear-gradient(180deg, rgba(0, 50, 100, 0.55) 0%, rgba(0, 20, 50, 0.2) 70%, transparent 100%);
      border-bottom: 1px solid rgba(0, 160, 233, 0.35);
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent2), #fff, var(--accent2), transparent);
      background-size: 200% 100%;
      animation: border-flow 4s linear infinite;
    }

    .header-time {
      font-family: "Orbitron", monospace;
      font-size: calc(15px * var(--font-scale));
      color: var(--accent2);
      letter-spacing: 2px;
      min-width: 180px;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
      padding: 6px 12px;
      border: 1px solid rgba(0, 160, 233, 0.3);
      border-radius: 4px;
      background: rgba(0, 30, 60, 0.4);
    }

    .header-title-wrap {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-deco {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent2), #fff);
      box-shadow: 0 0 8px var(--accent2);
    }
    .header-deco.right {
      background: linear-gradient(90deg, #fff, var(--accent2), transparent);
    }

    .header-title {
      font-size: calc(24px * var(--font-scale));
      font-weight: 700;
      letter-spacing: 6px;
      color: #fff;
      padding: 10px 40px;
      border: 1px solid rgba(0, 200, 255, 0.5);
      border-radius: 2px;
      position: relative;
      background: linear-gradient(180deg, rgba(0, 80, 160, 0.35) 0%, rgba(0, 30, 70, 0.2) 100%);
      box-shadow: 0 0 30px rgba(0, 160, 233, 0.3), inset 0 0 20px rgba(0, 200, 255, 0.05);
      animation: title-glow 3s ease-in-out infinite;
      overflow: hidden;
    }

    .header-title-wrap::before,
    .header-title-wrap::after {
      content: "◆";
      color: var(--accent2);
      font-size: calc(10px * var(--font-scale));
    }

    .title-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--accent2);
      border-style: solid;
      box-shadow: 0 0 6px var(--accent2);
    }
    .title-corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .title-corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .title-corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .title-corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .header-actions {
      display: flex;
      gap: 12px;
      min-width: 160px;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(0, 160, 233, 0.4);
      border-radius: 4px;
      background: rgba(0, 60, 120, 0.3);
      color: var(--accent2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(16px * var(--font-scale));
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .icon-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,212,255,0.3), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .icon-btn:hover {
      background: rgba(0, 120, 200, 0.5);
      border-color: var(--accent2);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
      transform: scale(1.05);
    }
    .icon-btn:hover::after { opacity: 1; }

    /* ===== Main Layout ===== */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 22% 1fr 22%;
      gap: 10px;
      padding: 8px 12px 12px;
      min-height: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    /* ===== Panel ===== */
    .panel {
      flex: 1;
      min-height: 0;
      background: var(--panel-bg);
      border: 1px solid rgba(0, 120, 200, 0.35);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(0, 200, 255, 0.1);
      transition: box-shadow 0.3s, border-color 0.3s;
    }
    .panel:hover {
      border-color: rgba(0, 200, 255, 0.5);
      box-shadow: 0 4px 30px rgba(0, 160, 233, 0.15), inset 0 1px 0 rgba(0, 200, 255, 0.2);
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent2), #fff, var(--accent2), transparent);
      background-size: 200% 100%;
      animation: border-flow 3s linear infinite;
    }

    .panel::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.04), transparent);
      animation: shimmer 6s ease-in-out infinite;
      pointer-events: none;
    }

    .panel-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--accent2);
      border-style: solid;
      opacity: 0.9;
      box-shadow: 0 0 6px rgba(0, 212, 255, 0.4);
      transition: all 0.3s;
    }
    .panel:hover .panel-corner { width: 22px; height: 22px; }
    .panel-corner.tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
    .panel-corner.tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
    .panel-corner.bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
    .panel-corner.br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

    .panel-header {
      padding: 10px 14px 8px;
      font-size: calc(15px * var(--font-scale));
      font-weight: 600;
      color: var(--accent2);
      border-bottom: 1px solid rgba(0, 120, 200, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
      background: linear-gradient(90deg, rgba(0, 80, 160, 0.2), transparent);
    }

    .panel-header::before {
      content: "";
      width: 4px;
      height: 16px;
      background: linear-gradient(180deg, var(--accent2), var(--accent));
      border-radius: 2px;
      box-shadow: 0 0 10px var(--accent2);
      animation: glow-pulse 2s ease-in-out infinite;
    }

    .panel-body {
      flex: 1;
      padding: 10px 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ===== Data Overview ===== */
    .overview-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      height: 100%;
      align-content: stretch;
    }

    .overview-card {
      background: linear-gradient(135deg, rgba(0, 80, 160, 0.35) 0%, rgba(0, 30, 70, 0.25) 100%);
      border: 1px solid rgba(0, 140, 220, 0.35);
      border-radius: 4px;
      padding: 10px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
      transition: all 0.35s;
      cursor: default;
    }
    .overview-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.15), transparent 70%);
      opacity: 0;
      transition: opacity 0.35s;
    }
    .overview-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent2);
      box-shadow: 0 8px 25px rgba(0, 160, 233, 0.25), inset 0 0 20px rgba(0, 200, 255, 0.05);
    }
    .overview-card:hover::before { opacity: 1; }

    .overview-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 160, 233, 0.2);
      border: 1px solid rgba(0, 200, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(18px * var(--font-scale));
      position: relative;
      animation: float-up 3s ease-in-out infinite;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
    }
    .overview-card:nth-child(2) .overview-icon { animation-delay: 0.5s; }
    .overview-card:nth-child(3) .overview-icon { animation-delay: 1s; }
    .overview-card:nth-child(4) .overview-icon { animation-delay: 1.5s; }
    .overview-icon::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid rgba(0, 212, 255, 0.3);
      animation: pulse-ring 2s ease-out infinite;
    }

    .overview-num {
      font-family: "Orbitron", monospace;
      font-size: calc(26px * var(--font-scale));
      font-weight: 700;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 15px rgba(0, 212, 255, 0.7);
    }

    .overview-label {
      font-size: calc(11px * var(--font-scale));
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ===== Search ===== */
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0, 40, 80, 0.5);
      border: 1px solid rgba(0, 120, 200, 0.35);
      border-radius: 4px;
      padding: 0 10px;
      margin-bottom: 8px;
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .search-box:focus-within {
      border-color: var(--accent2);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: calc(12px * var(--font-scale));
      padding: 7px 0;
    }
    .search-box input::placeholder { color: rgba(126, 184, 216, 0.5); }
    .search-box .search-icon { color: var(--text-dim); font-size: calc(13px * var(--font-scale)); }

    /* ===== Accordion List ===== */
    .place-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 160, 233, 0.4) transparent;
    }
    .place-list::-webkit-scrollbar { width: 4px; }
    .place-list::-webkit-scrollbar-thumb { background: rgba(0, 160, 233, 0.4); border-radius: 2px; }

    .place-item {
      border: 1px solid rgba(0, 100, 180, 0.25);
      border-radius: 4px;
      margin-bottom: 6px;
      overflow: hidden;
      animation: fade-slide-in 0.5s ease-out both;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .place-item:hover { border-color: rgba(0, 200, 255, 0.4); box-shadow: 0 0 12px rgba(0, 160, 233, 0.1); }

    .place-item-header {
      padding: 8px 10px;
      background: linear-gradient(90deg, rgba(0, 60, 120, 0.35), rgba(0, 40, 80, 0.2));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: calc(13px * var(--font-scale));
      user-select: none;
      transition: background 0.3s;
    }
    .place-item-header:hover { background: linear-gradient(90deg, rgba(0, 100, 180, 0.4), rgba(0, 60, 120, 0.3)); }
    .place-item-header .arrow { color: var(--accent2); font-size: calc(10px * var(--font-scale)); transition: transform 0.2s; }
    .place-item.open .arrow { transform: rotate(90deg); }

    .place-item-body {
      display: none;
      padding: 6px 8px;
      background: rgba(0, 30, 60, 0.3);
    }
    .place-item.open .place-item-body { display: block; }

    .person-card {
      background: rgba(0, 50, 100, 0.3);
      border: 1px solid rgba(0, 100, 180, 0.2);
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .person-card:last-child { margin-bottom: 0; }

    .person-info { flex: 1; min-width: 0; }
    .person-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .person-name { font-size: calc(13px * var(--font-scale)); font-weight: 600; }
    .person-role {
      display: inline-block;
      font-size: calc(10px * var(--font-scale));
      color: var(--accent2);
      background: rgba(0, 160, 233, 0.15);
      border: 1px solid rgba(0, 160, 233, 0.35);
      border-radius: 3px;
      padding: 1px 6px;
      white-space: nowrap;
    }
    .person-phone { font-size: calc(12px * var(--font-scale)); color: var(--text-dim); }

    .phone-btn {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(0, 200, 255, 0.5);
      background: linear-gradient(135deg, rgba(0, 140, 220, 0.4), rgba(0, 80, 160, 0.3));
      color: var(--accent2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 160, 233, 0.2);
    }
    .phone-btn:hover {
      background: linear-gradient(135deg, rgba(0, 180, 255, 0.6), rgba(0, 100, 200, 0.5));
      border-color: var(--accent2);
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.5);
      transform: scale(1.08);
    }
    .phone-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .btn-sm {
      flex: 1;
      padding: 4px 0;
      font-size: calc(11px * var(--font-scale));
      border: 1px solid rgba(0, 160, 233, 0.5);
      border-radius: 3px;
      background: rgba(0, 100, 180, 0.25);
      color: var(--accent2);
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .btn-sm:hover {
      background: rgba(0, 140, 220, 0.5);
      box-shadow: 0 0 10px rgba(0, 200, 255, 0.3);
      transform: translateY(-1px);
    }
    .btn-sm.primary {
      background: linear-gradient(135deg, rgba(0, 160, 233, 0.6), rgba(0, 80, 180, 0.5));
      border-color: var(--accent2);
      color: #fff;
    }
    .btn-sm.primary:hover { box-shadow: 0 0 15px rgba(0, 212, 255, 0.5); }

    /* ===== Check Management ===== */
    .check-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .check-person-select {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      background: rgba(0, 40, 80, 0.6);
      border: 1px solid rgba(0, 120, 200, 0.4);
      border-radius: 4px;
      color: var(--text);
      font-size: calc(12px * var(--font-scale));
      outline: none;
      cursor: pointer;
    }
    .check-person-select:focus { border-color: var(--accent2); box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }
    .check-person-select option { background: #0a1e3a; }

    .check-month-label {
      font-size: calc(11px * var(--font-scale));
      color: var(--accent2);
      white-space: nowrap;
      padding: 4px 8px;
      border: 1px solid rgba(0, 160, 233, 0.3);
      border-radius: 4px;
      background: rgba(0, 50, 100, 0.25);
    }

    .check-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 160, 233, 0.4) transparent;
    }
    .check-list::-webkit-scrollbar { width: 4px; }
    .check-list::-webkit-scrollbar-thumb { background: rgba(0, 160, 233, 0.4); border-radius: 2px; }

    .check-item {
      background: linear-gradient(135deg, rgba(0, 50, 100, 0.3), rgba(0, 30, 60, 0.2));
      border: 1px solid rgba(0, 100, 180, 0.25);
      border-radius: 4px;
      padding: 8px;
      display: flex;
      gap: 8px;
      transition: border-color 0.25s;
    }
    .check-item:hover { border-color: rgba(0, 200, 255, 0.4); }

    .check-item-info { flex: 1; min-width: 0; font-size: calc(11px * var(--font-scale)); }
    .check-row {
      display: flex;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .check-row label {
      color: var(--text-dim);
      width: 56px;
      flex-shrink: 0;
    }
    .check-row span { color: var(--text); flex: 1; }

    .check-result {
      display: inline-block;
      margin-top: 2px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: calc(10px * var(--font-scale));
      font-weight: 600;
    }
    .check-result.on {
      background: rgba(61, 214, 140, 0.15);
      color: #3dd68c;
      border: 1px solid rgba(61, 214, 140, 0.4);
    }
    .check-result.off {
      background: rgba(255, 71, 87, 0.15);
      color: #ff6b7a;
      border: 1px solid rgba(255, 71, 87, 0.4);
    }

    .check-screenshot { flex-shrink: 0; width: 88px; }

    .screenshot-frame {
      width: 88px;
      height: 66px;
      background: #0a0a0a;
      border: 1px solid rgba(0, 120, 200, 0.4);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .screenshot-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0, 200, 255, 0.03) 2px, rgba(0, 200, 255, 0.03) 4px
      );
    }
    .screenshot-frame::after {
      content: "📷";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      font-size: calc(18px * var(--font-scale));
      opacity: 0.35;
    }
    .screenshot-time {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 2px 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      font-size: calc(7px * var(--font-scale));
      letter-spacing: 0.3px;
      text-align: center;
      z-index: 1;

    .screenshot-rec {
      position: absolute;
      top: 3px; left: 4px;

      gap: 2px;
      font-size: calc(7px * var(--font-scale));
      color: #ff4444;
      z-index: 1;
    }

    .check-empty {
      text-align: center;
      padding: 20px;
      color: var(--text-dim);
      font-size: calc(12px * var(--font-scale));

    /* ===== Map Area ===== */
    .map-area {
      position: relative;
      border: 1px solid rgba(0, 160, 233, 0.5);
      border-radius: 2px;
      overflow: hidden;
      min-height: 0;
      box-shadow: 0 0 40px rgba(0, 100, 200, 0.15), inset 0 0 60px rgba(0, 0, 0, 0.3);
    }

    .map-frame-corner {
      position: absolute;
      width: 30px;
      height: 30px;
      z-index: 11;
      pointer-events: none;
    }
    .map-frame-corner::before,
    .map-frame-corner::after {
      content: "";
      position: absolute;
      background: var(--accent2);
      box-shadow: 0 0 8px var(--accent2);
    }
    .map-frame-corner.tl { top: 6px; left: 6px; }
    .map-frame-corner.tl::before { top: 0; left: 0; width: 20px; height: 2px; }
    .map-frame-corner.tl::after { top: 0; left: 0; width: 2px; height: 20px; }
    .map-frame-corner.tr { top: 6px; right: 6px; }
    .map-frame-corner.tr::before { top: 0; right: 0; width: 20px; height: 2px; }
    .map-frame-corner.tr::after { top: 0; right: 0; width: 2px; height: 20px; }
    .map-frame-corner.bl { bottom: 6px; left: 6px; }
    .map-frame-corner.bl::before { bottom: 0; left: 0; width: 20px; height: 2px; }
    .map-frame-corner.bl::after { bottom: 0; left: 0; width: 2px; height: 20px; }
    .map-frame-corner.br { bottom: 6px; right: 6px; }
    .map-frame-corner.br::before { bottom: 0; right: 0; width: 20px; height: 2px; }
    .map-frame-corner.br::after { bottom: 0; right: 0; width: 2px; height: 20px; }

    .map-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(1, 6, 16, 0.5) 100%);
    }

    .map-radar {
      position: absolute;
      left: 12px;
      bottom: 40px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1px solid rgba(0, 200, 255, 0.3);
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.6;
    }
    .map-radar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 212, 255, 0.4) 60deg, transparent 61deg);
      animation: radar-sweep 4s linear infinite;
    }
    .map-radar::after {
      content: "";
      position: absolute;
      inset: 15px;
      border-radius: 50%;
      border: 1px solid rgba(0, 200, 255, 0.2);
    }

    .map-toolbar-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
    }
    .map-toolbar-top > * { pointer-events: auto; }

    .map-toolbar-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .map-toolbar-priority {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      width: 100%;
    }
    .map-toolbar-priority .btn-fusion-comm,
    .map-toolbar-priority .btn-dispatch {
      width: 100%;
      justify-content: center;
    }

    .map-resource-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      max-height: min(52vh, 360px);
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .resource-btn {
      padding: 7px 14px;
      background: rgba(2, 15, 35, 0.92);
      border: 1px solid rgba(0, 140, 220, 0.4);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: calc(12px * var(--font-scale));
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      min-width: 118px;
    }
    .resource-btn:hover {
      border-color: var(--accent2);
      color: #fff;
      transform: translateX(-3px);
    }
    .resource-btn.active {
      background: linear-gradient(135deg, rgba(0, 120, 200, 0.6), rgba(0, 60, 140, 0.5));
      border-color: var(--accent2);
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.4);
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
    }
    .resource-btn[data-layer="streetHigh"].active { border-color: #00d4aa; box-shadow: 0 0 12px rgba(0,212,170,0.4); }
    .resource-btn[data-layer="villageMonitor"].active { border-color: #ff8c42; box-shadow: 0 0 12px rgba(255,140,66,0.4); }
    .resource-btn[data-layer="drone"].active { border-color: #6ec1ff; box-shadow: 0 0 12px rgba(110,193,255,0.4); }
    .resource-btn[data-layer="deployBall"].active { border-color: #e056fd; box-shadow: 0 0 12px rgba(224,86,253,0.4); }

    .btn-fusion-comm {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 8px;
      background: linear-gradient(135deg, rgba(55, 28, 110, 0.96), rgba(28, 12, 68, 0.96));
      border: 1px solid rgba(168, 85, 234, 0.55);
      border-radius: 8px;
      color: #e8d4ff;
      font-size: calc(12px * var(--font-scale));
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(80, 30, 140, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.3s;
      letter-spacing: 0.5px;
      min-width: 118px;
      position: relative;
      overflow: hidden;
    }
    .btn-fusion-comm::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.12) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.6s;
    }
    .btn-fusion-comm:hover::before { transform: translateX(120%); }
    .btn-fusion-comm:hover {
      border-color: #c084fc;
      color: #fff;
      box-shadow: 0 0 24px rgba(168, 85, 234, 0.5);
      transform: translateY(-1px);
    }
    .btn-fusion-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(168, 85, 234, 0.35), rgba(120, 50, 200, 0.25));
      border: 1px solid rgba(192, 132, 252, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(15px * var(--font-scale));
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(168, 85, 234, 0.3);
    }

    .map-toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-monitor-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 16px 5px 6px;
      background: linear-gradient(135deg, rgba(15, 45, 35, 0.95), rgba(8, 28, 22, 0.95));
      border: 1px solid rgba(61, 214, 140, 0.45);
      border-radius: 24px;
      color: #b8f0d0;
      font-size: calc(12px * var(--font-scale));
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: all 0.3s;
      letter-spacing: 0.5px;
    }
    .btn-monitor-toggle:hover {
      border-color: #3dd68c;
      color: #fff;
      box-shadow: 0 0 20px rgba(61, 214, 140, 0.35);
      transform: translateY(-1px);
    }
    .btn-monitor-toggle.active {
      background: linear-gradient(135deg, #16804a, #3dd68c);
      border-color: #5eeaa0;
      color: #fff;
      box-shadow: 0 0 22px rgba(61, 214, 140, 0.55);
    }
    .btn-monitor-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(61, 214, 140, 0.15);
      border: 1px solid rgba(61, 214, 140, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(16px * var(--font-scale));
      flex-shrink: 0;
      position: relative;
    }
    .btn-monitor-toggle.active .btn-monitor-icon {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
    }
    .btn-monitor-icon::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px solid rgba(61, 214, 140, 0.3);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn-monitor-toggle.active .btn-monitor-icon::after {
      opacity: 1;
      animation: monitor-ring-pulse 1.8s ease-out infinite;
    }
    @keyframes monitor-ring-pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .btn-monitor-badge {
      min-width: 18px;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(61, 214, 140, 0.25);
      border: 1px solid rgba(61, 214, 140, 0.4);
      font-size: calc(10px * var(--font-scale));
      color: #3dd68c;
      text-align: center;
    }
    .btn-monitor-toggle.active .btn-monitor-badge {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    .map-search {
      display: flex;
      align-items: center;
      background: rgba(2, 15, 35, 0.9);
      border: 1px solid rgba(0, 160, 233, 0.5);
      border-radius: 4px;
      padding: 0 12px;
      width: 280px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
    }
    .map-search:focus-within {
      border-color: var(--accent2);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
    }
    .map-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: calc(13px * var(--font-scale));
      padding: 8px 0;
    }
    .map-search input::placeholder { color: rgba(126, 184, 216, 0.5); }

    .btn-dispatch {
      padding: 8px 22px;
      background: linear-gradient(135deg, #0068b8, #00b4ff);
      border: 1px solid var(--accent2);
      border-radius: 4px;
      color: #fff;
      font-size: calc(13px * var(--font-scale));
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 160, 233, 0.5);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      letter-spacing: 1px;
    }
    .btn-dispatch::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }
    .btn-dispatch:hover {
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.7);
      transform: scale(1.03);
    }

    .map-layers {
      position: absolute;
      right: 12px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }

    .layer-btn {
      padding: 8px 14px;
      background: rgba(2, 15, 35, 0.9);
      border: 1px solid rgba(0, 140, 220, 0.4);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: calc(12px * var(--font-scale));
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }
    .layer-btn.active {
      background: linear-gradient(135deg, rgba(0, 120, 200, 0.6), rgba(0, 60, 140, 0.5));
      border-color: var(--accent2);
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.4);
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
    }
    .layer-btn:hover { border-color: var(--accent2); color: #fff; transform: translateX(-3px); }

    #map-container {
      width: 100%;
      height: 100%;
    }

    /* ===== Fire Alarms ===== */
    .alarm-filter {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .alarm-tab {
      flex: 1;
      min-width: 0;
      padding: 7px 4px;
      border-radius: 4px;
      border: 1px solid rgba(0, 120, 200, 0.35);
      background: rgba(0, 40, 80, 0.35);
      color: var(--text-dim);
      font-size: calc(11px * var(--font-scale));
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      line-height: 1.2;
    }
    .alarm-tab:hover { border-color: rgba(0, 200, 255, 0.5); color: #fff; }

    .alarm-tab-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(14px * var(--font-scale));
      border: 1.5px solid transparent;
    }
    .alarm-tab.active { color: #fff; font-weight: 600; }
    .alarm-tab.active .alarm-tab-icon { box-shadow: 0 0 12px currentColor; }

    .alarm-tab[data-type="all"] .alarm-tab-icon {
      background: rgba(0, 180, 255, 0.15);
      border-color: rgba(0, 212, 255, 0.5);
      color: #00d4ff;
    }
    .alarm-tab[data-type="all"].active {
      background: rgba(0, 120, 200, 0.35);
      border-color: #00d4ff;
    }

    .alarm-tab[data-type="call119"] .alarm-tab-icon {
      background: rgba(255, 71, 87, 0.15);
      border-color: rgba(255, 71, 87, 0.6);
      color: #ff4757;
    }
    .alarm-tab[data-type="call119"].active {
      background: rgba(255, 71, 87, 0.2);
      border-color: #ff4757;
      box-shadow: 0 0 12px rgba(255, 71, 87, 0.25);
    }

    .alarm-tab[data-type="controlHost"] .alarm-tab-icon {
      background: rgba(255, 165, 2, 0.15);
      border-color: rgba(255, 165, 2, 0.6);
      color: #ffa502;
    }
    .alarm-tab[data-type="controlHost"].active {
      background: rgba(255, 165, 2, 0.18);
      border-color: #ffa502;
      box-shadow: 0 0 12px rgba(255, 165, 2, 0.25);
    }

    .alarm-tab[data-type="aiAlert"] .alarm-tab-icon {
      background: rgba(168, 85, 234, 0.15);
      border-color: rgba(168, 85, 234, 0.6);
      color: #a855ea;
    }
    .alarm-tab[data-type="aiAlert"].active {
      background: rgba(168, 85, 234, 0.18);
      border-color: #a855ea;
      box-shadow: 0 0 12px rgba(168, 85, 234, 0.25);
    }

    .alarm-tab-count {
      font-family: "Orbitron", monospace;
      font-size: calc(10px * var(--font-scale));
      opacity: 0.85;
    }

    .alarm-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 160, 233, 0.4) transparent;
    }
    .alarm-list::-webkit-scrollbar { width: 4px; }
    .alarm-list::-webkit-scrollbar-thumb { background: rgba(0, 160, 233, 0.4); border-radius: 2px; }

    .alarm-item {
      background: linear-gradient(135deg, rgba(0, 40, 80, 0.35), rgba(0, 25, 55, 0.25));
      border: 1px solid rgba(0, 100, 180, 0.25);
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 6px;
      transition: all 0.3s;
      animation: fade-slide-in 0.4s ease-out both;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: pointer;
    }
    .alarm-item:hover {
      border-color: rgba(0, 200, 255, 0.35);
      box-shadow: 0 0 12px rgba(0, 160, 233, 0.1);
    }

    .alarm-item-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(18px * var(--font-scale));
      border: 1.5px solid;
    }
    .alarm-item.type-call119 .alarm-item-icon {
      background: rgba(255, 71, 87, 0.15);
      border-color: rgba(255, 71, 87, 0.5);
      box-shadow: 0 0 10px rgba(255, 71, 87, 0.2);
    }
    .alarm-item.type-controlHost .alarm-item-icon {
      background: rgba(255, 165, 2, 0.15);
      border-color: rgba(255, 165, 2, 0.5);
      box-shadow: 0 0 10px rgba(255, 165, 2, 0.2);
    }
    .alarm-item.type-aiAlert .alarm-item-icon {
      background: rgba(168, 85, 234, 0.15);
      border-color: rgba(168, 85, 234, 0.5);
      box-shadow: 0 0 10px rgba(168, 85, 234, 0.2);
    }

    .alarm-item-body { flex: 1; min-width: 0; }
    .alarm-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; gap: 6px; }
    .alarm-item-id { font-size: calc(11px * var(--font-scale)); color: var(--text-dim); }
    .alarm-type-tag {
      font-size: calc(10px * var(--font-scale));
      padding: 1px 6px;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .alarm-type-tag.call119 { background: rgba(255,71,87,0.2); color: #ff6b7a; border: 1px solid rgba(255,71,87,0.4); }
    .alarm-type-tag.controlHost { background: rgba(255,165,2,0.2); color: #ffb732; border: 1px solid rgba(255,165,2,0.4); }
    .alarm-type-tag.aiAlert { background: rgba(168,85,234,0.2); color: #c084fc; border: 1px solid rgba(168,85,234,0.4); }

    .alarm-item-desc { font-size: calc(12px * var(--font-scale)); line-height: 1.45; margin-bottom: 6px; }
    .alarm-item-bottom { display: flex; justify-content: space-between; align-items: center; }
    .alarm-item-date { font-size: calc(11px * var(--font-scale)); color: var(--text-dim); }
    .alarm-status {
      font-size: calc(10px * var(--font-scale));
      padding: 2px 7px;
      border-radius: 8px;
    }
    .alarm-status.pending { background: rgba(245,200,66,0.2); color: var(--warn); border: 1px solid rgba(245,200,66,0.4); }
    .alarm-status.done { background: rgba(61,214,140,0.2); color: var(--success); border: 1px solid rgba(61,214,140,0.4); }

    .alarm-empty {
      text-align: center;
      padding: 24px 10px;
      color: var(--text-dim);
      font-size: calc(12px * var(--font-scale));
    }

    /* ===== Alarm Detail Modal ===== */
    .alarm-detail-box {
      width: min(920px, 94vw);
      max-height: 90vh;
      background: linear-gradient(180deg, #0a2240 0%, #061528 100%);
      border: 1px solid rgba(0, 160, 233, 0.55);
      border-radius: 6px;
      box-shadow: 0 0 50px rgba(0, 80, 160, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;

    .alarm-detail-title {

      padding: 14px 40px 12px;

      border-bottom: 1px solid rgba(0, 120, 200, 0.3);

      color: rgba(255,255,255,0.7);
      font-size: calc(18px * var(--font-scale));

      z-index: 3;

      display: flex;
      align-items: center;
      justify-content: center;

    .alarm-detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px 18px;
      scrollbar-width: thin;
    }

    .alarm-summary-card {
      background: rgba(0, 50, 100, 0.25);
      border: 1px solid rgba(0, 140, 220, 0.35);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .alarm-summary-main { flex: 1; min-width: 0; }
    .alarm-summary-id {
      font-size: calc(14px * var(--font-scale));
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .alarm-summary-id label { color: var(--text-dim); font-weight: normal; }
    .alarm-detail-status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: calc(11px * var(--font-scale));
      background: rgba(255, 165, 2, 0.2);
      color: #ffb732;
      border: 1px solid rgba(255, 165, 2, 0.5);
    }
    .alarm-detail-status.done {

    /* ===== Particle Background ===== */
    function initParticles() {
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      let w, h;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      const count = Math.min(120, Math.floor(w * h / 12000));
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.5 + 0.5,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          alpha: Math.random() * 0.5 + 0.2
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach((p, i) => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 200, 255, ${p.alpha})`;
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(0, 160, 233, ${0.12 * (1 - dist / 100)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        });
        requestAnimationFrame(draw);
      }
      draw();
    }
    initParticles();

    /* ===== Count Up Animation ===== */
    function animateCount(el, target, duration = 1500) {
      const start = performance.now();
      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.floor(eased * target);
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = target;
      }
      requestAnimationFrame(step);
    }

    document.querySelectorAll("[data-count]").forEach((el, i) => {

    function startMonitorStream() {
      stopMonitorStream();
      const canvas = document.getElementById("monitor-canvas");
      const viewer = canvas.parentElement;
      const ctx = canvas.getContext("2d");
      let frame = 0;

      function resizeCanvas() {
        canvas.width = viewer.clientWidth;
        canvas.height = viewer.clientHeight;
      }
      resizeCanvas();

      function draw() {
        frame++;
        const w = canvas.width, h = canvas.height;
        const m = currentMonitor;
        if (!m) return;

        ctx.fillStyle = "#0a1520";
        ctx.fillRect(0, 0, w, h);

        const hue = (m.id.charCodeAt(1) * 17 + frame) % 360;
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, `hsl(${hue}, 30%, 12%)`);
        grad.addColorStop(1, `hsl(${hue + 40}, 25%, 8%)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = "rgba(0, 200, 255, 0.06)";
        ctx.lineWidth = 1;
        for (let y = 0; y < h; y += 4) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }

        if (frame % 30 < 2) {
          ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.08})`;
          for (let i = 0; i < 80; i++) {
            ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
          }
        }

        ctx.fillStyle = "rgba(255,255,255,0.08)";
        const streamIcon = m.category === "drone" ? "🚁" : m.category === "deployBall" ? "📡" : "📷";
        ctx.font = "bold 58px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(streamIcon, w / 2, h / 2 - 20);
        ctx.font = "17px sans-serif";
        ctx.fillStyle = "rgba(184, 236, 255, 0.6)";
        ctx.fillText(m.name, w / 2, h / 2 + 20);
        ctx.font = "14px sans-serif";
        ctx.fillStyle = "rgba(184, 236, 255, 0.4)";
        const streamHint = monitorModalContext === "resource"
          ? (m.status ? `状态：${m.status}${m.battery ? ` · 电量 ${m.battery}` : ""}` : "演示监控画面 · 实际接入视频流")
          : "演示监控画面 · 实际接入视频流";
        ctx.fillText(streamHint, w / 2, h / 2 + 42);

        const now = new Date();
        const pad = n => String(n).padStart(2, "0");
        const timeStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        document.getElementById("monitor-overlay-time").textContent = timeStr;

        monitorAnimFrame = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopMonitorStream() {
      if (monitorAnimFrame) {
        cancelAnimationFrame(monitorAnimFrame);
        monitorAnimFrame = null;
      }
    }

    function getHostStats() {
      const allDevices = hostUnitsData.flatMap(u => u.devices);

      const handled = hostHistoryData.filter(h => h.status === "done").length;
      const unhandled = hostHistoryData.filter(h => h.status === "pending").length;
      return { total: 36, online: 32, offline: 4, alertTotal, handled, unhandled };
    }

    function renderHostStats() {
      const s = getHostStats();

    function renderHostHistory(filter = currentHistoryFilter, keyword = "") {
      currentHistoryFilter = filter;
      const kw = keyword.toLowerCase();
      let items = hostHistoryData;
      if (filter === "done") items = items.filter(h => h.status === "done");
      if (filter === "pending") items = items.filter(h => h.status === "pending");
      if (kw) {
        items = items.filter(h =>
          h.unit.includes(kw) || h.device.includes(kw) || h.desc.includes(kw) || h.id.toLowerCase().includes(kw)
        );
      }
      items = items.sort((a, b) => b.time - a.time);

      const list = document.getElementById("host-history-list");
      if (!items.length) {
        list.innerHTML = `<div class="alarm-empty">近24小时内暂无预警记录</div>`;
        return;
      }
      list.innerHTML = items.map(h => `
        <div class="host-history-item">
          <div class="host-history-top">
            <span class="host-history-time">${h.timeStr}</span>
            <span class="alarm-status ${h.status === "done" ? "done" : "pending"}">${h.statusText}</span>
          </div>
          <div class="host-history-unit">${h.unit}</div>
          <div class="host-history-desc">${h.desc}</div>
          <div class="host-history-device">设备：${h.device} · ${h.id}</div>
        </div>
      `).join("");
    }

    function formatLastBeat(lastBeat) {
      if (lastBeat.startsWith("-")) return lastBeat.replace("-", "") + "前";
      return "今日 " + lastBeat;
    }

    function getHostUnitsByCategory(cat) {
      if (cat === "control") {
        return hostUnitsData.filter(u => u.devices.some(d => d.controlRoom));
      }
      return hostUnitsData.filter(u => u.category === cat);
    }

    function getHostDevicesForUnit(unit, statusFilter, category) {
      let devices = unit.devices;
      if (category === "control") devices = devices.filter(d => d.controlRoom);
      if (statusFilter === "online") devices = devices.filter(d => d.status === "online");
      if (statusFilter === "offline") devices = devices.filter(d => d.status === "offline");
      return devices;
    }

    function getHostCategoryStats(cat, statusFilter) {
      const units = getHostUnitsByCategory(cat);
      const devices = units.flatMap(u => getHostDevicesForUnit(u, statusFilter, cat));
      const online = devices.filter(d => d.status === "online").length;
      const offline = devices.filter(d => d.status === "offline").length;
      return { total: devices.length, online, offline };
    }

    function renderHostSidebar() {
      const catEl = document.getElementById("host-categories");
      catEl.innerHTML = Object.entries(HOST_CATEGORIES).map(([key, cat]) => {
        const count = getHostCategoryStats(key, currentDeviceFilter).total;
        return `
          <button class="monitor-cat-btn${currentHostCategory === key ? " active" : ""}" data-cat="${key}">
            <span>${cat.icon}</span><span>${cat.label}</span>
            <span class="monitor-cat-count">${count}</span>

      }).join("");

      catEl.querySelectorAll(".monitor-cat-btn").forEach(btn => {

          currentHostCategory = btn.dataset.cat;
          const units = getHostUnitsByCategory(currentHostCategory);
          currentHostUnit = units.find(u => getHostDevicesForUnit(u, currentDeviceFilter, currentHostCategory).length)?.name || null;
          renderHostSidebar();
          renderHostDevicePanel();
        });
      });

      const units = getHostUnitsByCategory(currentHostCategory).filter(u =>
        getHostDevicesForUnit(u, currentDeviceFilter, currentHostCategory).length
      );

      const listEl = document.getElementById("host-unit-list");
      if (!units.length) {
        listEl.innerHTML = `<div class="alarm-empty" style="padding:12px 8px">该分类下暂无设备</div>`;
        return;

      listEl.innerHTML = units.map(u => {

        const online = devs.filter(d => d.status === "online").length;
        return `

            <div class="monitor-device-name">${u.name}</div>
            <div class="monitor-device-unit">${devs.length}台 · 在线${online}</div>
          </div>

      }).join("");

      listEl.querySelectorAll(".monitor-device-item").forEach(item => {

    function openDispatchModal(prefill = {}) {
      resetDispatchForm();

        updateDispatchReceivers(prefill.dept, prefill.receiver || "");
      }
      if (prefill.desc) document.getElementById("dispatch-desc").value = prefill.desc;
      if (prefill.type) document.getElementById("dispatch-type").value = prefill.type;
      if (prefill.detailLocation) document.getElementById("dispatch-detail-loc").value = prefill.detailLocation;
      document.getElementById("dispatch-modal").classList.add("open");
      setTimeout(() => initDispatchMap(prefill.position), 250);

    function closeDispatchModal() {
      document.getElementById("dispatch-modal").classList.remove("open");
      destroyDispatchMap();
    }

    function destroyDispatchMap() {
      if (dispatchMap) {
        dispatchMap.destroy();
        dispatchMap = null;
        dispatchMarker = null;
      }
    }

    function initDispatchMap(position) {
      destroyDispatchMap();
      const container = document.getElementById("dispatch-map");
      if (!container || !window.AMap) return;

      let center = MAP_CENTER;
      if (position) center = position;
      else if (map) {
        const c = map.getCenter();
        center = [c.lng, c.lat];
      }

      dispatchMap = new AMap.Map(container, {
        zoom: 16,
        center,
        mapStyle: "amap://styles/normal",
        features: ["bg", "road", "building", "point"],
        showLabel: true
      });

      dispatchMap.on("click", e => setDispatchLocation(e.lnglat.getLng(), e.lnglat.getLat()));

      if (position) setDispatchLocation(position[0], position[1]);
    }

    function setDispatchLocation(lng, lat) {
      if (!dispatchMap) return;
      dispatchPosition = [lng, lat];
      if (dispatchMarker) dispatchMap.remove(dispatchMarker);
      const pin = document.createElement("div");
      pin.style.cssText = "width:22px;height:22px;background:#ff4444;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(255,68,68,0.8)";
      dispatchMarker = new AMap.Marker({
        position: [lng, lat],
        map: dispatchMap,
        content: pin,
        offset: new AMap.Pixel(-11, -11)
      });
      dispatchMap.setCenter([lng, lat]);
      if (geocoder) {
        geocoder.getAddress([lng, lat], (status, result) => {
          if (status === "complete" && result.regeocode) {
            document.getElementById("dispatch-location").value = result.regeocode.formattedAddress;
          } else {
            document.getElementById("dispatch-location").value = `${lng.toFixed(6)}, ${lat.toFixed(6)}`;
          }
        });
      }
    }

      const btn = document.getElementById("dispatch-upload-btn");

      dispatchImages.forEach((url, i) => {

        wrap.className = "dispatch-upload-preview";
        wrap.innerHTML = `

          <button class="dispatch-upload-remove" data-idx="${i}">×</button>
        `;
        area.insertBefore(wrap, btn);
        wrap.querySelector(".dispatch-upload-remove").addEventListener("click", () => {
          dispatchImages.splice(i, 1);
          renderDispatchPreviews();
        });

    function startGudMonitorPreview(unit) {
      stopGudMonitorPreview();
      const canvas = document.getElementById("gud-monitor-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const wrap = canvas.parentElement;
      let frame = 0;

      function resize() {
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;
      }
      resize();

      function draw() {
        frame++;
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = "#0a1520";
        ctx.fillRect(0, 0, w, h);
        const hue = (unit.id.charCodeAt(1) * 20 + frame) % 360;
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, `hsl(${hue}, 25%, 12%)`);
        grad.addColorStop(1, `hsl(${hue + 30}, 20%, 8%)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.font = "bold 36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("📷", w / 2, h / 2 - 10);
        ctx.font = "13px sans-serif";
        ctx.fillStyle = "rgba(184,236,255,0.6)";
        ctx.fillText(unit.name + " · 实时监控", w / 2, h / 2 + 18);
        gudAnimFrame = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopGudMonitorPreview() {
      if (gudAnimFrame) {
        cancelAnimationFrame(gudAnimFrame);
        gudAnimFrame = null;
      }
    }

    function drawGridFeature(feature, index, gridIndex) {
      const props = feature.properties || {};
      const geom = feature.geometry;
      if (!geom || geom.type !== "Polygon") return;

      const path = geom.coordinates[0];
      const isStreet = props.type === "street";

      const polygon = new AMap.Polygon({
        path,
        strokeColor: isStreet ? "#ff6b00" : (ZONE_COLORS[props.zone]?.stroke || "#0099e6"),
        strokeWeight: isStreet ? 3.5 : 1.8,
        strokeOpacity: isStreet ? 0.95 : 0.85,
        strokeStyle: isStreet ? "solid" : "solid",
        fillColor: isStreet ? "rgba(255, 107, 0, 0.04)" : (ZONE_COLORS[props.zone]?.fill || "rgba(0,180,255,0.25)"),
        fillOpacity: isStreet ? 0.04 : 0.45,
        bubble: true,
        zIndex: isStreet ? 10 : 50 + gridIndex,
        extData: { type: isStreet ? "street" : "grid", name: props.name }
      });

      if (!isStreet) {
        polygon.on("mouseover", () => {
          polygon.setOptions({ fillOpacity: 0.65, strokeWeight: 2.5 });
        });
        polygon.on("mouseout", () => {
          polygon.setOptions({ fillOpacity: 0.45, strokeWeight: 1.8 });
        });
        polygon.on("click", () => openGridModal(props.name));
      }

      markerGroups.grid.push(polygon);
      map.add(polygon);

      if (!isStreet) {
        try {
          const center = getPolygonCenter(path);
          const label = new AMap.Text({
            text: props.name.replace("网格", ""),
            position: center,
            anchor: "center",
            style: {
              "background-color": "rgba(0, 25, 55, 0.75)",
              "border": "1px solid rgba(0, 200, 255, 0.4)",
              "border-radius": "3px",
              "padding": "2px 6px",
              "font-size": "calc(10px * var(--font-scale))",
              "color": "#ddffff",
              "white-space": "nowrap"
            },
            zIndex: 150 + gridIndex,
            extData: { type: "gridLabel", name: props.name }
          });
          markerGroups.grid.push(label);
          map.add(label);
          label.on("click", () => openGridModal(props.name));
        } catch (err) {
          console.warn("网格标签创建失败:", err);
        }
      }
    }

    function loadGridsFromGeoJSON(geojson) {
      let gridIndex = 0;
      geojson.features.forEach(f => {
        const isStreet = f.properties?.type === "street";
        drawGridFeature(f, 0, isStreet ? -1 : gridIndex);
        if (!isStreet) gridIndex++;
      });
    }


    // Community red dots and enterprise blue dots (from reference image)
    const COMMUNITY_DOTS = [{"name": "草芳", "pos": [118.7295, 32.232], "zone": "blue"}, {"name": "晓山", "pos": [118.729, 32.222], "zone": "blue"}, {"name": "新庄", "pos": [118.7305, 32.2175], "zone": "blue"}, {"name": "化建", "pos": [118.7305, 32.212], "zone": "blue"}, {"name": "吴家洼", "pos": [118.7345, 32.2145], "zone": "blue"}, {"name": "湖滨", "pos": [118.736, 32.2205], "zone": "blue"}, {"name": "九龙洼", "pos": [118.7345, 32.208], "zone": "blue"}, {"name": "四周", "pos": [118.7415, 32.227], "zone": "green"}, {"name": "旭东新城", "pos": [118.7425, 32.2245], "zone": "green"}, {"name": "新华五村", "pos": [118.742, 32.221], "zone": "green"}, {"name": "新华六村", "pos": [118.7405, 32.224], "zone": "green"}, {"name": "太子山", "pos": [118.7385, 32.233], "zone": "green"}, {"name": "周洼新村", "pos": [118.741, 32.2335], "zone": "green"}, {"name": "新华一村", "pos": [118.7435, 32.2195], "zone": "green"}, {"name": "新华七村", "pos": [118.746, 32.22], "zone": "green"}, {"name": "欣乐", "pos": [118.7505, 32.2285], "zone": "yellow"}, {"name": "十村", "pos": [118.7525, 32.2255], "zone": "yellow"}, {"name": "扬子四居", "pos": [118.753, 32.234], "zone": "yellow"}, {"name": "扬子三居", "pos": [118.756, 32.233], "zone": "yellow"}, {"name": "扬子二居", "pos": [118.7585, 32.2305], "zone": "yellow"}, {"name": "山畔新村", "pos": [118.756, 32.227], "zone": "yellow"}, {"name": "九村", "pos": [118.7585, 32.2255], "zone": "yellow"}, {"name": "扬子一居", "pos": [118.762, 32.229], "zone": "yellow"}, {"name": "和平", "pos": [118.763, 32.22], "zone": "yellow"}, {"name": "欣乐", "pos": [118.7435, 32.222], "zone": "yellow"}];
    const ENTERPRISE_DOTS = [{"name": "钢铁公司", "pos": [118.735, 32.208]}, {"name": "南京热电厂", "pos": [118.7405, 32.2085]}, {"name": "华润电厂", "pos": [118.745, 32.21]}, {"name": "南化氮肥厂", "pos": [118.7485, 32.2115]}, {"name": "南化集团公司", "pos": [118.7525, 32.2125]}, {"name": "南化磷肥厂", "pos": [118.756, 32.214]}, {"name": "南化化机厂", "pos": [118.752, 32.2165]}];

    let gridDotsRendered = false;
    function renderGridDots() {
      COMMUNITY_DOTS.forEach(d => {
        const marker = new AMap.Marker({
          position: d.pos,
          content: `<div style="display:flex;flex-direction:column;align-items:center;cursor:pointer;"><div style="width:10px;height:10px;border-radius:50%;background:#ff3344;border:2px solid #fff;box-shadow:0 0 6px rgba(255,51,68,0.8);"></div><div style="margin-top:2px;padding:1px 4px;background:rgba(80,0,20,0.8);border:1px solid rgba(255,51,68,0.5);border-radius:2px;font-size:calc(10px * var(--font-scale));color:#ffcccc;white-space:nowrap;line-height:1.2;text-shadow:0 0 3px rgba(0,0,0,0.9);">${d.name}</div></div>`,
          offset: new AMap.Pixel(-20, -5),
          anchor: "center",
          zIndex: 200,
          extData: { type: "communityDot", name: d.name }
        });
        markerGroups.grid.push(marker);
        map.add(marker);
      });

      ENTERPRISE_DOTS.forEach(d => {
        const marker = new AMap.Marker({
          position: d.pos,
          content: `<div style="display:flex;flex-direction:column;align-items:center;cursor:pointer;"><div style="width:10px;height:10px;border-radius:50%;background:#1a73e8;border:2px solid #fff;box-shadow:0 0 6px rgba(26,115,232,0.8);"></div><div style="margin-top:2px;padding:1px 4px;background:rgba(0,20,60,0.8);border:1px solid rgba(26,115,232,0.5);border-radius:2px;font-size:calc(10px * var(--font-scale));color:#aaccff;white-space:nowrap;line-height:1.2;text-shadow:0 0 3px rgba(0,0,0,0.9);">${d.name}</div></div>`,
          offset: new AMap.Pixel(-20, -5),
          anchor: "center",
          zIndex: 200,
          extData: { type: "enterpriseDot", name: d.name }
        });
        markerGroups.grid.push(marker);
        map.add(marker);
      });
    }

    let gridsRendered = false;

    function initGridLayer() {
      if (!gridsRendered) {
        loadGridsFromGeoJSON(GRIDS_GEOJSON);
        renderGridDots();
        syncLayerVisibility("grid");
        gridsRendered = true;
      }

      fetch("data/grids.json")
        .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
        .then(data => {
          if (data?.features?.length) {
            markerGroups.grid.forEach(o => map.remove(o));
            markerGroups.grid = [];
            loadGridsFromGeoJSON(data);
            renderGridDots();
            syncLayerVisibility("grid");
          }
        })
        .catch(err => console.warn("网格远程数据加载失败，已使用内置数据:", err));
    }

    function overlayStreetBoundary(boundaries) {
      markerGroups.grid
        .filter(o => o.getExtData?.()?.type === "street")
        .forEach(o => map.remove(o));
      markerGroups.grid = markerGroups.grid.filter(o => o.getExtData?.()?.type !== "street");

      boundaries.forEach(path => {
        const polygon = new AMap.Polygon({
          path,
          strokeColor: "#ff6b00",
          strokeWeight: 3.5,
          strokeOpacity: 0.95,
          strokeStyle: "solid",
          fillColor: "rgba(255, 107, 0, 0.03)",
          fillOpacity: 0.03,
          bubble: true,
          zIndex: 9,
          extData: { type: "street", name: "大厂街道" }
        });
        markerGroups.grid.push(polygon);
        map.add(polygon);
      });
      syncLayerVisibility("grid");
    }

    function toggleLayer(layer) {
      layerState[layer] = !layerState[layer];
      document.querySelectorAll(`[data-layer="${layer}"]`).forEach(btn => {
        btn.classList.toggle("active", layerState[layer]);
      });
      syncLayerVisibility(layer);
    }

    function handleMapLayerClick(e) {
      const resourceBtn = e.target.closest(".resource-btn");
      if (resourceBtn?.dataset.layer) {
        toggleLayer(resourceBtn.dataset.layer);
        return;
      }
      const layerBtn = e.target.closest(".layer-btn");
      if (layerBtn?.dataset.layer) {
        toggleLayer(layerBtn.dataset.layer);
      }
    }

    document.getElementById("map-layers").addEventListener("click", handleMapLayerClick);
    document.getElementById("map-resource-panel").addEventListener("click", handleMapLayerClick);

    document.getElementById("fusion-comm-close").addEventListener("click", closeFusionCommModal);
    document.getElementById("fusion-comm-modal").addEventListener("click", e => {
      if (e.target.id === "fusion-comm-modal") closeFusionCommModal();
    });

    document.getElementById("btn-monitor-toggle").addEventListener("click", () => {
      toggleLayer("monitor");
    });

    document.getElementById("monitor-count-badge").textContent = monitorPoints.length;

    function initMap() {
      AMapLoader.load({
        key: "61705867fdebdd431b32e451ad34f5a0",
        version: "2.0",
        plugins: ["AMap.Geocoder", "AMap.PlaceSearch", "AMap.Scale", "AMap.DistrictSearch"]
      }).then((AMap) => {
        window.AMap = AMap;

        map = new AMap.Map("map-container", {
          viewMode: "3D",
          pitch: 50,
          rotation: -5,
          zoom: 16,
          center: MAP_CENTER,
          mapStyle: "amap://styles/normal",
          features: ["bg", "road", "building"],
          showLabel: false,
          showBuildingBlock: true
        });

        map.addControl(new AMap.Scale());

        geocoder = new AMap.Geocoder({ city: "南京市" });

        placeSearch = new AMap.PlaceSearch({
          city: "南京市",
          pageSize: 5,
          autoFitView: false
        });

        addMarkers();
        initGridLayer();
        map.on("complete", () => syncLayerVisibility("grid"));
        Object.keys(layerState).forEach(layer => {
          if (!layerState[layer]) {
            markerGroups[layer].forEach(m => m.hide && m.hide());
          }
        });

        document.getElementById("map-search").addEventListener("keydown", e => {
          if (e.key === "Enter") {
            const keyword = e.target.value.trim();
            if (!keyword) return;
            placeSearch.search(keyword, (status, result) => {
              if (status === "complete" && result.poiList.pois.length) {
                const poi = result.poiList.pois[0];
                map.setCenter(poi.location);
                map.setZoom(17);
                const info = new AMap.InfoWindow({
                  content: `<div style="padding:4px"><b>${poi.name}</b><br/>${poi.address || ""}</div>`,
                  offset: new AMap.Pixel(0, -20)
                });
                info.open(map, poi.location);
              }
            });
          }
        });
      }).catch(e => {
        console.error("地图加载失败:", e);
        document.getElementById("map-container").innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#7eb8d8">地图加载失败，请检查网络或密钥配置</div>';
      });
    }

    initMap();
  </script>
</body>
</html>
